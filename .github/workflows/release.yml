name: Build and release Q2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - uses: cachix/cachix-action@v17
        with:
          name: neoney

      - name: Build Q2 release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="$(nix eval --raw .#zip.version)"

          mkdir -p dist
          nix build .#zip \
            --out-link "dist/q2.zip" \
            --print-build-logs

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if existing_target=$(gh release view "$VERSION" --json targetCommitish --jq .targetCommitish 2>/dev/null); then
            if [ "$existing_target" != "$GITHUB_SHA" ]; then
              echo "Release $VERSION already belongs to $existing_target" >&2
              exit 1
            fi

            gh release upload "$VERSION" "dist/q2.zip" --clobber
          else
            gh release create "$VERSION" \
              "dist/q2.zip" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --latest \
              --notes "Automated Q2 build for commit $GITHUB_SHA."
          fi
