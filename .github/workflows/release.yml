name: Build and release Q2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - uses: cachix/cachix-action@v17
        with:
          name: neoney

      - name: Build Q2 release archive
        id: package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          package_path="$(nix eval --raw .#zip.package.outPath)"
          previous_body="$(gh release view --json body --jq .body 2>/dev/null || true)"

          if [[ "$previous_body" == *"Package output: \`$package_path\`"* ]]; then
            echo "Package output is unchanged: $package_path"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(nix eval --raw .#zip.version)"

          mkdir -p dist
          nix build .#zip \
            --out-link "dist/q2.zip" \
            --print-build-logs

          {
            echo "version=$version"
            echo "package_path=$package_path"
            echo "changed=true"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: steps.package.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.package.outputs.version }}
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
        shell: bash
        run: |
          set -euo pipefail
          notes="Automated Q2 build for commit $GITHUB_SHA. Package output: \`$PACKAGE_PATH\`."

          if existing_target=$(gh release view "$VERSION" --json targetCommitish --jq .targetCommitish 2>/dev/null); then
            if [ "$existing_target" != "$GITHUB_SHA" ]; then
              echo "Release $VERSION already belongs to $existing_target" >&2
              exit 1
            fi

            gh release upload "$VERSION" "dist/q2.zip" --clobber
            gh release edit "$VERSION" --notes "$notes"
          else
            gh release create "$VERSION" \
              "dist/q2.zip" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --latest \
              --notes "$notes"
          fi
